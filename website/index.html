<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrainSync Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-theme="dark">
    <!-- Navigation -->
    <nav class="navbar">
      <div class="nav-brand" data-route="home">
        <img src="/logo.png" alt="BrainSync" style="height: 32px; vertical-align: middle; margin-right: 8px; border-radius: 6px;">
        BrainSync
      </div>
      <div class="nav-links">
        <a href="#home" data-route="home" class="nav-link active">Home</a>
        <a href="#quickstart" data-route="quickstart" class="nav-link">Quick Start</a>
        <a href="#insights" data-route="insights" class="nav-link">Insights</a>
        <div id="authContainer" class="auth-container" style="display: flex; align-items: center; margin-left: 20px;"></div>
      </div>
    </nav>

    <!-- Login Wall (Shows when not logged in) -->
    <section id="loginWall" class="login-wall" style="text-align: center; max-width: 400px; margin: 80px auto; padding: 40px; background: var(--surface); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: var(--shadow); backdrop-filter: blur(10px);">
      <div style="font-size: 3rem; margin-bottom: 10px;">🔐</div>
      <h2 style="margin-bottom: 20px;">Login Required</h2>
      <p style="color: var(--text-muted); margin-bottom: 30px;">Please enter your credentials to view and manage your personalized settings.</p>
      <form id="loginForm" style="display: flex; flex-direction: column; gap: 15px;">
        <input type="text" id="identityInput" placeholder="Username or Email" style="padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.1); color: var(--text-main); font-size: 1rem;" required>
        <input type="email" id="emailInput" placeholder="Email" style="padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.1); color: var(--text-main); font-size: 1rem; display: none;" required>
        <input type="password" id="passwordInput" placeholder="Password" style="padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.1); color: var(--text-main); font-size: 1rem;" required>
        <div id="loginError" style="color: #ff4d4d; font-size: 0.9rem; display: none;">Invalid username/email or password.</div>
        <button type="submit" id="loginSubmitBtn" class="primary-btn" style="margin-top: 10px;">Login</button>
        <button type="button" id="toggleCreateAccountBtn" class="secondary-btn">Create an account</button>
      </form>
    </section>

    <!-- Main Content Area -->
    <main id="app-content">
      <!-- Views will be injected here by app.js -->
    </main>
    <!-- Modal Overlays -->
    <div id="insight-modal-overlay" class="modal-overlay"></div>
    <div id="preset-modal-overlay" class="modal-overlay"></div>
    <script src="/app.js"></script>
  </body>
</html>
